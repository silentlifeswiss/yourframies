[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "26"
  SHADOWFAX_MODE = "staging"
  DELHIVERY_API_TOKEN = "a83902984b7d61ecb111ccc79229c7a1e1f3e472"
  DELHIVERY_MODE = "production"
  RAZORPAY_KEY_ID = "rzp_live_U5OGherACJU1kQ"
  RAZORPAY_KEY_SECRET = "zTZlr04fo2Ay5YN10Do4n6ai"
  VITE_RAZORPAY_KEY_ID = "rzp_live_U5OGherACJU1kQ"

# Route API calls to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application (SPA) Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers & Content Security Policy
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
